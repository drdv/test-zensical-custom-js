[project]
site_name = "Test custom javascript with instant navigation"
site_url = "https://test-zensical-custom-js.pages.dev/"  # this causes the problem

nav = [
  {"Home" = "index.md"},
  {"Map" = "map.md"},
]

[project.theme]
custom_dir = "docs/overrides"
features = [
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.indexes",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "navigation.instant",
]

# -----------------------------------------------------
# custom config variables
# -----------------------------------------------------

[[project.extra.maps_javascript]]
path = "javascripts/leaflet.js"

[[project.extra.maps_javascript]]
path = "javascripts/maps_show_routs.js"

[[project.extra.maps_css]]
path = "stylesheets/leaflet.css"

[[project.extra.maps_css]]
path = "stylesheets/maps.css"
